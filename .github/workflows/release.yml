name: Release

# Only a tag publishes. A branch push cannot reach npm, so nobody releases by accident.
on:
  push:
    tags: ['v*']

# id-token: write is what makes trusted publishing work — GitHub mints a short-lived OIDC token
# that npm verifies against the publisher configured on the package. There is no NPM_TOKEN in this
# workflow and there should never be one: a long-lived registry credential in repository secrets is
# the thing trusted publishing exists to remove.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Node 22.14+ and npm 11.5.1+ are hard requirements for trusted publishing. The npm bundled
      # with the Node 22 runner image is older than that, so it is upgraded explicitly rather than
      # left to whatever the image happens to ship.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Pinned, not @latest. npm 12 requires Node ^22.22.2 and the runner's Node 22 is not
      # guaranteed to be that patch, so @latest can fail the release with EBADENGINE on a day
      # nobody changed anything. 11.19.1 carries OIDC publishing and runs on any Node >= 22.9.
      - run: npm install -g npm@11.19.1

      - name: Confirm the toolchain can do trusted publishing
        run: |
          node --version
          npm --version

      - run: npm ci

      - run: npm run type-check

      - run: npm test

      - run: npm run build

      # Provenance is implied by trusted publishing, but stating it keeps the intent visible and the
      # command honest if this ever runs somewhere without OIDC.
      #
      # The two packages version independently: a client-only change leaves geo-data untouched, and
      # npm rejects republishing a version that already exists. Skipping a version already on the
      # registry keeps that ordinary case green, so a red run still means something actually broke.
      - name: Publish @mb-digital/geo
        run: ./.github/publish-workspace.sh @mb-digital/geo

      - name: Publish @mb-digital/geo-data
        run: ./.github/publish-workspace.sh @mb-digital/geo-data
