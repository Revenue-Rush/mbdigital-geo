name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run type-check

      - run: npm test

      - run: npm run build

      # The tarball is where secrets and stray source leak. Fail the build on a surprise rather than
      # discovering it after a publish that cannot be undone.
      - name: Inspect the publishable tarball
        run: npm pack --workspace @mb-digital/geo --dry-run
